# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

legal_mentions:
    path: /mentions-legales
    controller: App\Controller\LegalController::mentions

legal_confidentialite:
    path: /confidentialite
    controller: App\Controller\LegalController::confidentialite

legal_contact:
    path: /contact
    controller: App\Controller\LegalController::contact

reset_password_request:
    path: /reset-password
    controller: App\Controller\ResetPasswordController::request

reset_password_email:
    path: /reset-password/email
    controller: App\Controller\ResetPasswordController::emailSent

reset_password_new:
    path: /reset-password/{token}
    controller: App\Controller\ResetPasswordController::reset
